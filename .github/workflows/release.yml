# The release (ADR 0002 in haltia-de/device-lenovo-b8000h): a vX.Y.Z tag
# builds the signed Alpine package, the debs and the Flatpak into the GitHub release.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  apk:
    uses: haltia-de/ci/.github/workflows/apk.yml@v1
    with:
      arch: noarch
    secrets: inherit
  # Debian 13, Ubuntu 24.04 and 26.04, and Flatpak: for Haltia's own repositories.
  deb:
    needs: apk
    uses: haltia-de/ci/.github/workflows/deb.yml@v1
    secrets: inherit
  flatpak:
    needs: apk
    uses: haltia-de/ci/.github/workflows/flatpak.yml@v1
    secrets: inherit
    with:
      manifest: packaging/flatpak/io.github.haltia_de.Messenger.yml

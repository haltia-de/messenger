# Сообщения as a Flatpak, for Haltia's own repository only (an unofficial
# client of MAX: not for Flathub):
#   flatpak run org.flatpak.Builder --user --install --force-clean build packaging/flatpak/io.github.haltia_de.Messenger.yml
# Python 3, PyGObject and GTK 3 come with the GNOME runtime. The kit is a copy
# of haltia-de/kit's module (python-mpv and mutagen with it). libmpv, with the
# mpv player that opens videos, is built here (flathub/shared-modules has none),
# after io.mpv.Mpv's manifest. PyMax, Telethon and their packages: requirements.txt's
# versions, as PyPI's wheels by sha256 (pure ones where PyPI has them; cp314
# wheels for x86_64 and aarch64 otherwise). Built from this checkout.
id: io.github.haltia_de.Messenger
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: haltia-messenger
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # V4L2/libcamera access; the camera is opened only by the call controls.
  - --device=all
  - --socket=pulseaudio
  # files are saved to «Загрузки/MAX» without a dialog unless the name is taken
  - --filesystem=xdg-download
  # the unread count on the program's button (Unity LauncherEntry)
  - --talk-name=com.canonical.Unity
  # what plays (MPRIS)
  - --own-name=org.mpris.MediaPlayer2.io.github.haltia_de.Messenger
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - haltia-kit.yml

  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=true
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dwerror=false
    cleanup:
      - /share/applications
      - /share/icons
      - /share/bash-completion
      - /share/zsh
      - /share/fish
      - /share/doc
      - /etc
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

